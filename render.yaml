services:
  - type: web
    name: family-ledger
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    preDeployCommand: npm run db:deploy
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: APP_URL
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: AI_PROVIDER
        value: openai
      - key: AI_MODEL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: AG_STUDIO_LICENSE_KEY
        sync: false
databases:
  - name: family-ledger-db
    plan: free
    databaseName: family_ledger
    user: family_ledger
    postgresMajorVersion: "16"
